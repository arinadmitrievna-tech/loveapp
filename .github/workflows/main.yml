name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf automake \
            libtool libtool-bin libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            gettext \
            autopoint

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer.git
          pip install legacy-cgi setuptools cython==0.29.34

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          echo "===== ПОСЛЕДНИЕ 200 СТРОК ====="
          tail -n 200 build.log

          echo "===== СТРОКИ С ОШИБКАМИ ====="
          grep -n -E "ERROR|error:|Error|FAILED|failed|not supported" build.log | tail -n 100 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LoveApp-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LoveApp-build-log
          path: build.log
